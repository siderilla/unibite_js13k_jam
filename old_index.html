<!DOCTYPE html>
<html lang="it">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Unicorn Rainbow Run - Prototype</title>
	<style>
		/* Resetta i margini di default del browser */
		body {
			margin: 0;
			padding: 0;
			background-color: #050505;
			/* Sfondo scuro attorno al gioco */
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			overflow: hidden;
			/* Impedisce lo scroll accidentale con le frecce */
			font-family: sans-serif;
		}

		/* Stile del box del gioco */
		canvas {
			background-color: #111;
			box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);

			/* Forza la larghezza visiva a 800x600 */
			width: 800px;
			height: 600px;
			
			/* LA MAGIA: Diciamo al browser di NON smussare i pixel quando ingrandisce */
			image-rendering: pixelated;
			image-rendering: crisp-edges;
		}
	</style>
</head>

<body>

	<!-- Il nostro schermo di gioco -->
	<canvas id="game" width="800" height="600"></canvas>

	<!-- Colleghiamo la logica Javascript -->
	<script src="unicorn_run.js"></script>

</body>

</html>
